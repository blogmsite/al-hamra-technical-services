name: Deploy rewrite
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the human rewrite
        run: |
          cp al-hamra-technical-services.html index.html
          rm al-hamra-technical-services.html
          git config user.name "blogmsite"
          git config user.email "blogmsite@users.noreply.github.com"
          git add -A
          git commit -m "Deploy human rewrite: plain Dubai-specific copy, no AI-sounding lines"
          git push
